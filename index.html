<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Cart — Order & Reorder Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 1060px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 22px; color: var(--accent); }
    .sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    select, input, button {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
    }
    button.primary {
      background: var(--accent);
      color: #052e16;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .section-title { font-size: 15px; margin: 20px 0 10px; color: #e2e8f0; font-weight: 600; }
    .insights-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: grid;
      gap: 8px;
    }
    .insight-line {
      font-size: 13.5px;
      color: #e2e8f0;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.55);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      font-size: 13px;
      margin-bottom: 18px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .due { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .soon { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .ok { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .empty { padding: 20px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Smart Cart Dashboard</h1>
        <p class="sub" id="conn-status">Connecting to Supabase...</p>
      </div>
      <button class="primary" onclick="loadPurchases()">Refresh Orders</button>
    </header>

    <div class="controls">
      <select id="month-filter" onchange="renderDashboard()">
        <option value="ALL">All Months</option>
      </select>
      <select id="city-filter" onchange="renderDashboard()">
        <option value="ALL">All Cities</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Thane">Thane</option>
        <option value="Delhi">Delhi</option>
        <option value="Hapur">Hapur</option>
      </select>
      <select id="platform-filter" onchange="renderDashboard()">
        <option value="ALL">All Platforms</option>
        <option value="Blinkit">Blinkit</option>
        <option value="Zepto">Zepto</option>
        <option value="Swiggy Instamart">Swiggy Instamart</option>
        <option value="JioMart">JioMart</option>
        <option value="Amazon India">Amazon India</option>
      </select>
      <input type="text" id="search-input" placeholder="Search product (e.g. milk, detergent)..." oninput="renderDashboard()" />
    </div>

    <div class="grid">
      <div class="stat">
        <div class="stat-label">Filtered Orders</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Milk Orders (Selected)</div>
        <div class="stat-val" id="stat-milk" style="color:#38bdf8;">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Due for Reorder</div>
        <div class="stat-val" id="stat-due" style="color:#f59e0b;">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Spend</div>
        <div class="stat-val" id="stat-spend">₹0</div>
      </div>
    </div>

    <div class="section-title" id="summary-heading">Monthly Order Summary</div>
    <div class="insights-box" id="monthly-insights"></div>

    <div class="section-title">Smart Reorder Predictions</div>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Orders in Selected Period</th>
          <th>Last Store</th>
          <th>Last Bought</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="reorder-body"></tbody>
    </table>

    <div class="section-title">Recent Purchase History</div>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Platform</th>
          <th>City</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "https://ximnejiileskvdymiybv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpbW5lamlpbGVza3ZkeW1peWJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMTM3NTMsImV4cCI6MjExMDU4OTc1M30.OIYYShNv96L7SDdTTo37l4LGiX-WJUGzXCQ7PH_ii5Q";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allRows = [];

    function getMonthKey(dateStr) {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return null;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}`;
    }

    function formatMonthLabel(monthKey) {
      if (!monthKey || monthKey === "ALL") return "All Months";
      const [y, m] = monthKey.split("-");
      const d = new Date(Number(y), Number(m) - 1, 1);
      return d.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    }

    function getCanonicalGroup(name) {
      const n = (name || "").toLowerCase();
      if (/(milk|doodh)/.test(n)) return "Milk";
      if (/(curd|buttermilk|paneer)/.test(n)) return "Curd / Paneer";
      if (/(bread)/.test(n)) return "Bread";
      if (/(detergent|tide|surf|rin)/.test(n)) return "Detergent";
      if (/(vim|dishwash)/.test(n)) return "Dishwash";
      if (/(soap|dettol)/.test(n)) return "Bathing Soap";
      if (/(oil|sunflower|ghee)/.test(n)) return "Cooking Oil / Ghee";
      if (/(onion|potato|tomato)/.test(n)) return "Vegetables";
      if (/(turmeric|haldi|salt|sugar|hing|sabudana|sattu|chana|atta|rice|dal)/.test(n)) return "Kitchen Staples";
      if (/(biscuit|cookies|monaco|krack jack|good day|nutrichoice|little hearts)/.test(n)) return "Biscuits & Snacks";
      return name.trim();
    }

    function estimateCycleDays(name) {
      const n = name.toLowerCase();
      if (/(milk|bread|curd|paneer)/.test(n)) return 2;
      if (/(egg|banana|fruit|vegetable|tomato|onion|potato)/.test(n)) return 7;
      if (/(oil|atta|flour|rice|dal|sugar|tea|coffee|biscuit|cookies)/.test(n)) return 15;
      if (/(shampoo|soap|toothpaste|detergent|tide|surf|cleaner)/.test(n)) return 30;
      return 14;
    }

    function populateMonthDropdown() {
      const monthSet = new Set();
      allRows.forEach((r) => {
        const k = getMonthKey(r.purchased_at);
        if (k) monthSet.add(k);
      });
      const sorted = Array.from(monthSet).sort((a, b) => b.localeCompare(a));
      const sel = document.getElementById("month-filter");
      const prev = sel.value;
      sel.innerHTML = `<option value="ALL">All Months</option>` +
        sorted.map((k) => `<option value="${k}">${formatMonthLabel(k)}</option>`).join("");
      if (sorted.includes(prev)) sel.value = prev;
    }

    async function loadPurchases() {
      const statusEl = document.getElementById("conn-status");
      statusEl.textContent = "Syncing latest rows...";

      const { data, error } = await db
        .from("purchases")
        .select("*")
        .order("purchased_at", { ascending: false })
        .limit(1000);

      if (error) {
        statusEl.textContent = "Database error: " + error.message;
        return;
      }

      allRows = data || [];
      statusEl.textContent = `Connected · ${allRows.length} records loaded`;
      populateMonthDropdown();
      renderDashboard();
    }

    function renderDashboard() {
      const monthVal = document.getElementById("month-filter").value;
      const city = document.getElementById("city-filter").value;
      const platform = document.getElementById("platform-filter").value;
      const query = document.getElementById("search-input").value.trim().toLowerCase();

      const filtered = allRows.filter((r) => {
        if (monthVal !== "ALL" && getMonthKey(r.purchased_at) !== monthVal) return false;
        if (city !== "ALL" && (r.city || "").toLowerCase() !== city.toLowerCase()) return false;
        if (platform !== "ALL" && (r.platform || "").toLowerCase() !== platform.toLowerCase()) return false;
        if (query && !(r.product_name || "").toLowerCase().includes(query)) return false;
        return true;
      });

      document.getElementById("stat-total").textContent = filtered.length;
      const milkCount = filtered.filter((r) => getCanonicalGroup(r.product_name) === "Milk").length;
      document.getElementById("stat-milk").textContent = milkCount;

      const spend = filtered.reduce((acc, r) => acc + (parseFloat(r.price) || 0), 0);
      document.getElementById("stat-spend").textContent = "₹" + Math.round(spend).toLocaleString("en-IN");

      // Group by Smart Category (e.g. Milk, Detergent, Dishwash) for readable monthly sentences
      const periodLabel = monthVal === "ALL" ? "All recorded months" : `In ${formatMonthLabel(monthVal)}`;
      document.getElementById("summary-heading").textContent = `Order Frequency Summary (${formatMonthLabel(monthVal)})`;

      const catMap = new Map();
      filtered.forEach((r) => {
        const cat = getCanonicalGroup(r.product_name);
        if (!catMap.has(cat)) catMap.set(cat, { count: 0, spend: 0 });
        const entry = catMap.get(cat);
        entry.count += 1;
        entry.spend += parseFloat(r.price) || 0;
      });

      const sortedCats = Array.from(catMap.entries()).sort((a, b) => b[1].count - a[1].count);
      const insightsEl = document.getElementById("monthly-insights");
      insightsEl.innerHTML = sortedCats.length
        ? sortedCats.slice(0, 12).map(([cat, info]) => {
            const timesWord = info.count === 1 ? "1 time" : `${info.count} times`;
            return `<div class="insight-line">${periodLabel}, you ordered <strong>${cat}</strong> <strong>${timesWord}</strong> (Total: ₹${Math.round(info.spend).toLocaleString("en-IN")})</div>`;
          }).join("")
        : `<div class="empty">No orders found for ${formatMonthLabel(monthVal)}.</div>`;

      // Predictions table (always based on city/platform/search across history so cycle predictions stay accurate)
      const predRows = allRows.filter((r) => {
        if (city !== "ALL" && (r.city || "").toLowerCase() !== city.toLowerCase()) return false;
        if (platform !== "ALL" && (r.platform || "").toLowerCase() !== platform.toLowerCase()) return false;
        if (query && !(r.product_name || "").toLowerCase().includes(query)) return false;
        return true;
      });

      const grouped = new Map();
      predRows.forEach((r) => {
        const key = (r.product_name || "").trim().toLowerCase();
        if (!key) return;
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(r);
      });

      const predictions = [];
      grouped.forEach((items) => {
        items.sort((a, b) => new Date(b.purchased_at) - new Date(a.purchased_at));
        const latest = items[0];
        const periodCount = monthVal === "ALL"
          ? items.length
          : items.filter((it) => getMonthKey(it.purchased_at) === monthVal).length;
        let cycleDays = estimateCycleDays(latest.product_name);

        if (items.length >= 2) {
          const diffs = [];
          for (let i = 0; i < items.length - 1; i++) {
            const d = (new Date(items[i].purchased_at) - new Date(items[i + 1].purchased_at)) / 86400000;
            if (d >= 1) diffs.push(d);
          }
          if (diffs.length > 0) {
            cycleDays = Math.round(diffs.reduce((a, b) => a + b, 0) / diffs.length);
          }
        }

        const daysSince = (Date.now() - new Date(latest.purchased_at).getTime()) / 86400000;
        const daysLeft = Math.round(cycleDays - daysSince);
        predictions.push({ latest, periodCount, daysLeft });
      });

      predictions.sort((a, b) => b.periodCount - a.periodCount || a.daysLeft - b.daysLeft);
      const dueCount = predictions.filter((p) => p.daysLeft <= 2).length;
      document.getElementById("stat-due").textContent = dueCount;

      const reorderBody = document.getElementById("reorder-body");
      reorderBody.innerHTML = predictions.length
        ? predictions.slice(0, 35).map(({ latest, periodCount, daysLeft }) => {
            let badge = `<span class="badge ok">In ${daysLeft}d</span>`;
            if (daysLeft <= 0) badge = `<span class="badge due">Due Today</span>`;
            else if (daysLeft <= 2) badge = `<span class="badge soon">Due in ${daysLeft}d</span>`;
            const countText = periodCount === 1 ? "Ordered 1 time" : `Ordered ${periodCount} times`;
            return `<tr>
              <td>${latest.product_name}</td>
              <td><strong>${countText}</strong></td>
              <td>${latest.platform || "-"}</td>
              <td>${new Date(latest.purchased_at).toLocaleDateString("en-IN")}</td>
              <td>${badge}</td>
            </tr>`;
          }).join("")
        : `<tr><td colspan="5" class="empty">No items match the selected filter.</td></tr>`;

      const historyBody = document.getElementById("history-body");
      historyBody.innerHTML = filtered.length
        ? filtered.slice(0, 100).map((r) => `<tr>
            <td>${r.product_name}</td>
            <td>${r.quantity || "1 unit"}</td>
            <td>₹${r.price || 0}</td>
            <td>${r.platform || "-"}</td>
            <td>${r.city || "-"}</td>
            <td>${new Date(r.purchased_at).toLocaleDateString("en-IN")}</td>
          </tr>`).join("")
        : `<tr><td colspan="6" class="empty">No purchase records found.</td></tr>`;
    }

    loadPurchases();
  </script>
</body>
</html>
